<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Focus App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    .search-area input[type="text"] {
      flex-grow: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 1em;
      color: #333;
      text-align: left;
    }

    .search-area button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #fdd835;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-area button:hover {
      background-color: #fbc02d;
    }

    .icon {
      font-size: 5em;
      margin: 15px 0;
    }

    .details {
      display: flex;
      justify-content: space-around;
      font-size: 1em;
      margin-top: 20px;
      width: 100%;
    }

    .details div {
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.8em;
      opacity: 0.8;
    }

    /* 5-day forecast */
    .forecast {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      flex-wrap: nowrap;
    }

    .forecast-day {
      text-align: center;
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px;
      border-radius: 10px;
      min-width: 50px;
    }

    .forecast-day .icon {
      font-size: 2em;
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <div class="weather-card">
    <div class="search-area">
      <input id="cityInput" type="text" placeholder="Enter city name">
      <button id="searchButton">Search</button>
    </div>

    <h2 id="cityName">City, Country</h2>
    <div class="icon" id="weatherIcon">❓</div>
    <h1 id="temperature">--°C</h1>
    <p id="description">Check the weather</p>

    <div class="details">
      <div>
        <p>💧 Humidity</p>
        <p id="humidity">--%</p>
      </div>
      <div>
        <p>🌬 Wind</p>
        <p id="wind">-- m/s</p>
      </div>
    </div>

    <div class="footer" id="updatedAt">Updated: Never</div>

    <!-- 5-Day Forecast Section -->
    <div class="forecast" id="forecast"></div>

  </div>

  <script src="script.js"></script>
</body>

</html>
